plugins {
    id 'com.android.application'
}

android {
    namespace 'com.compass.proj'
    compileSdk 33

    defaultConfig {
        applicationId "com.compass.proj"
        minSdk 24
        targetSdk 33
        versionCode 20
        versionName "2.0"
    }

    // 正式签名：密钥与密码在 android/keystore.properties（不入库，务必离线备份）
    // 缺失时构建报错，防止误用调试签名发布
    def ksProps = new Properties()
    def ksFile = rootProject.file("keystore.properties")
    if (!ksFile.exists()) {
        throw new GradleException("缺少 android/keystore.properties（签名配置），参见 README「从源码构建」")
    }
    ksFile.withInputStream { ksProps.load(it) }
    signingConfigs {
        release {
            storeFile rootProject.file(ksProps['storeFile'])
            storePassword ksProps['storePassword']
            keyAlias ksProps['keyAlias']
            keyPassword ksProps['keyPassword']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
